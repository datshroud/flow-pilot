name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality gates (TypeScript)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      IDENTITY_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/flowpilot_identity

    services:
      postgres:
        image: postgres:18.4-trixie
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: flowpilot_identity
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Enable pnpm through Corepack
        run: |
          corepack enable
          corepack install
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Apply database migrations
        run: pnpm --filter @flowpilot/identity exec prisma migrate deploy

      - name: Integration tests
        run: pnpm test:integration

      - name: Build
        run: pnpm build

  ml:
    name: Quality gates (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: services/ml

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          # Must match the interpreter the lockfiles were compiled on —
          # pip-compile resolves per Python version.
          python-version: '3.14'
          cache: pip
          cache-dependency-path: |
            services/ml/requirements.txt
            services/ml/requirements-dev.txt

      # The .txt files are generated lockfiles (ADR-014 requires exact pins).
      # Recompiling here would defeat them, so CI installs them as committed
      # and fails if they drift from the .in files.
      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
          pip install -e . --no-deps
          
      # A recompile-and-diff check cannot work here. pip-tools 7.6 resolves for
      # the platform it runs on, so a lockfile compiled on a Windows dev machine
      # never matches one compiled on this Linux runner: pandas requires tzdata
      # only on win32, and uvicorn[standard] requires uvloop only off it. A fresh
      # resolve is also time-dependent — it picks up any patch released since.
      # The mistake actually worth catching is adding a dependency to a .in file
      # and forgetting to regenerate the lockfile, which needs no resolution.
      - name: Verify every direct requirement is pinned
        run: |
          python - <<'PY'
          import re
          import sys
          from pathlib import Path


          def declared(path: str) -> set[str]:
              names = set()
              for raw in Path(path).read_text().splitlines():
                  line = raw.strip()
                  if not line or line.startswith(("#", "-")):
                      continue
                  names.add(re.split(r"[\[<>=!;~ ]", line)[0].lower())
              return names


          def pinned(path: str) -> set[str]:
              names = set()
              for line in Path(path).read_text().splitlines():
                  if line.startswith((" ", "#")) or "==" not in line:
                      continue
                  names.add(line.split("==")[0].strip().lower())
              return names


          failed = False
          for stem in ("requirements", "requirements-dev"):
              missing = sorted(declared(f"{stem}.in") - pinned(f"{stem}.txt"))
              if missing:
                  failed = True
                  print(
                      f"::error::{stem}.in declares {missing}, "
                      f"but {stem}.txt does not pin them. Run pip-compile."
                  )

          sys.exit(1 if failed else 0)
          PY


      - name: Lint
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

      - name: Typecheck
        run: mypy

      - name: Tests
        run: pytest
