name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality gates (TypeScript)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      IDENTITY_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/flowpilot_identity

    services:
      postgres:
        image: postgres:18.4-trixie
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: flowpilot_identity
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Enable pnpm through Corepack
        run: |
          corepack enable
          corepack install
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Apply database migrations
        run: pnpm --filter @flowpilot/identity exec prisma migrate deploy

      - name: Integration tests
        run: pnpm test:integration

      - name: Build
        run: pnpm build

  ml:
    name: Quality gates (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: services/ml

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          # Must match the interpreter the lockfiles were compiled on —
          # pip-compile resolves per Python version.
          python-version: '3.14'
          cache: pip
          cache-dependency-path: |
            services/ml/requirements.txt
            services/ml/requirements-dev.txt

      # The .txt files are generated lockfiles (ADR-014 requires exact pins).
      # Recompiling here would defeat them, so CI installs them as committed
      # and fails if they drift from the .in files.
      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
          pip install -e . --no-deps

      # --no-header keeps the output free of the generating command and
      # Python version, so the diff reports real dependency drift only.
      - name: Verify lockfiles are current
        run: |
          pip-compile --no-header --strip-extras --quiet -o /tmp/requirements.txt requirements.in
          pip-compile --no-header --strip-extras --quiet -o /tmp/requirements-dev.txt requirements-dev.in
          diff -u requirements.txt /tmp/requirements.txt
          diff -u requirements-dev.txt /tmp/requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

      - name: Typecheck
        run: mypy

      - name: Tests
        run: pytest
